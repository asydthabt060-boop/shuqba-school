<script>
const [classes,rows]=JSON.parse(document.getElementById('source').textContent);
const days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const names=[...new Set(rows.flatMap(([cells])=>cells.map(v=>v[1]).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'ar'));
const get=id=>document.getElementById(id), mode=get('mode'),pick=get('pick'),table=get('table');
function cell(row,text,heading=false){
 const node=document.createElement(heading?'th':'td');node.textContent=text||'—';row.append(node);return node;
}
function make(headers){
 table.replaceChildren();const tr=table.createTHead().insertRow();headers.forEach(t=>cell(tr,t,true));return table.createTBody();
}
function render(){
 const value=pick.value, m=mode.value;
 if(value===''){get('heading').textContent='لا توجد نتائج مطابقة';table.replaceChildren();return;}
 get('heading').textContent=m==='general'?'البرنامج العام · '+days[Number(value)]:m==='cover'?'المعلمون المتاحون · '+days[Number(value)]:m==='class'?classes[Number(value)]:value;
 if(m==='general'){
  const h=table.createTHead();h.replaceChildren();table.tBodies[0]?.remove();
  const a=h.insertRow(),b=h.insertRow(), first=cell(a,'الحصة',true);first.rowSpan=2;
  classes.forEach(t=>{cell(a,t,true).colSpan=2;cell(b,'المادة',true);cell(b,'المعلم',true);});
  const body=table.createTBody();
  for(let p=0;p<7;p++){const tr=body.insertRow();cell(tr,String(p+1),true);
   for(const [sub,t] of rows[Number(value)*7+p][0]){
    const x=cell(tr,sub),y=cell(tr,t);if(sub==='إشغال')x.className=y.className='cover';
   }
  }
 }else if(m==='cover'){
  const body=make(['الحصة','المعلمون المتاحون']);
  for(let p=0;p<7;p++){const tr=body.insertRow();cell(tr,String(p+1),true);cell(tr,rows[Number(value)*7+p][1]||'لا يوجد معلم متاح').className='available';}
 }else{
  const body=make(['الحصة',...days]);
  for(let p=0;p<7;p++){const tr=body.insertRow();cell(tr,String(p+1),true);
   for(let d=0;d<5;d++){
    const entries=rows[d*7+p][0];
    const c=m==='class'?Number(value):entries.findIndex(x=>x[1]===value);
    const [sub,t]=entries[c]||[];
    const td=cell(tr,sub||'');
    if(sub){const detail=document.createElement('small');detail.textContent=m==='class'?t:classes[c];td.append(detail);}
    if(sub==='إشغال')td.className='cover';
   }
  }
 }
}
function options(){
 const m=mode.value;
 get('pickText').textContent=m==='teacher'?'المعلم':m==='class'?'الشعبة':'اليوم';
 const list=m==='teacher'?names:m==='class'?classes:days;
 const search=get('search'), filterable=m==='teacher'||m==='class';
 get('searchLabel').hidden=!filterable;
 search.placeholder=m==='teacher'?'اكتب اسم المعلم':'اكتب اسم الشعبة';
 const normalize=text=>text.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/\s+/g,'');
 const query=filterable?normalize(search.value):'';
 const previous=pick.value;
 pick.replaceChildren(...list.flatMap((name,i)=>normalize(name).includes(query)?[new Option(name,m==='teacher'?name:String(i))]:[]));
 if(Array.from(pick.options).some(option=>option.value===previous))pick.value=previous;
 render();
}
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{
 mode.value=button.dataset.mode;get('search').value='';pick.replaceChildren();
 for(const tab of document.querySelectorAll('[data-mode]'))tab.setAttribute('aria-pressed',String(tab===button));
 options();
};
get('search').oninput=options;pick.onchange=render;get('print').onclick=()=>window.print();
get('download').onclick=()=>{
 const a=document.createElement('a');a.href='data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+document.getElementById('excel').textContent.trim();
 a.download='Shuqba-School-Four-Period-Minimum.xlsx';a.click();
